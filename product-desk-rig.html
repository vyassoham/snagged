  <script>
    function submitPdpOrder(e, itemName, price) {
      e.preventDefault();
      const orderId='SNG-'+Math.floor(100000+Math.random()*900000);
      const btn=document.getElementById('pdpBtn');
      btn.innerHTML='Processing...'; btn.disabled=true;
      setTimeout(()=>{
        btn.innerHTML='Confirmed — Opening WhatsApp'; btn.classList.add('bg-sage'); btn.classList.remove('bg-ink-950');
        const waText=encodeURIComponent(`Hi Snagged Team,\n\nCOD Order #${orderId}\nItem: ${itemName}\nAmount: ₹${price}`);
        setTimeout(()=>{ window.location.href=`https://wa.me/919210023153?text=${waText}`; },1000);
      },800);
    }
